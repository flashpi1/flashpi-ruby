name: Release

# release-please keeps a release PR open with the next version and its CHANGELOG, built from
# the Conventional Commits merged into main. Merging that PR is the approval: it tags the
# version, creates the GitHub release and publishes the gem to RubyGems here.
#
# release-please works with a token of the organization's GitHub App (the organization variable
# FLASHPI_BOT_CLIENT_ID and secret FLASHPI_BOT_PRIVATE_KEY, shared with the other SDKs). A pull
# request opened with GITHUB_TOKEN gets its CI only after someone approves it, and checks from
# dispatched runs do not count for the required ones; one opened with the App's token runs CI
# like any other.
#
# RubyGems trusted publishing (OIDC): no RubyGems API key is stored anywhere. rubygems.org trusts
# this workflow file of flashpi1/flashpi-ruby in the `rubygems` environment and hands the publish
# job a short-lived key for its OIDC token. A pending trusted publisher, registered on rubygems.org before the first
# release, lets this workflow publish 0.1.0 too (see CONTRIBUTING.md). The build job builds and
# checks the gem without any secret; the publish job, the only one with `id-token: write`, only
# pushes it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    # release-please uses the App's token, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A one-hour token for this repository only, with just what release-please needs: push the
      # release branch, tag and release (contents), open the PR (pull requests) and label it
      # (issues). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # CI runs on the release PR by itself. The live API test spends the demo issuer's daily quota,
  # so it only runs on demand: start it on the release branch whenever release-please updates it.
  live-test:
    name: Live test on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - run: gh workflow run live.yml --ref "$BRANCH"

  # Building runs the gemspec of this repository and RubyGems, so it runs here, with a read-only
  # token and no access to RubyGems. The publish job only pushes what this job built and checked.
  build:
    name: Build the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # An exact Ruby, no Bundler and no gem: `gem build` runs only RubyGems and the gemspec,
      # which reads lib/flashpi/version.rb.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0.9'
          bundler: none
      - name: Build the gem
        run: gem build flashpi.gemspec
      - name: Check it against the tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ruby scripts/package_check.rb "flashpi-${TAG#v}.gem" "$TAG"
          mkdir dist
          mv "flashpi-${TAG#v}.gem" dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: dist/
          if-no-files-found: error
          # The publish job waits for the rubygems environment's approval, for up to 30 days.
          retention-days: 30

  # The only job that can get a RubyGems key (trusted publishing through the `rubygems`
  # environment). It checks out nothing and runs no code of this repository or of any gem: it
  # downloads the gem the build job checked, exchanges its OIDC token with curl and jq, and pushes
  # the gem with RubyGems' own `gem push`.
  publish:
    name: Publish to RubyGems
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: rubygems
      url: https://rubygems.org/gems/flashpi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: dist/
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0.9'
          bundler: none
      # Trusted publishing by hand, with curl and jq from the runner image: the job's OIDC token is
      # exchanged for a short-lived RubyGems key, which only `gem push` sees. The exchange names the
      # RubyGems.org account that owns the gem (`owner`, its numeric id, the RUBYGEMS_OWNER_ID
      # variable of the `rubygems` environment): since 2026-10-30 rubygems.org only lets trusted
      # publishing create a new gem when the exchange names the account whose pending trusted
      # publisher it uses, and rubygems/configure-rubygems-credentials v2.1.0 cannot send it. Once
      # the gem exists the owner is not needed, and sending it is harmless. The token is single
      # use, so the exchange is not retried.
      - name: Publish
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RUBYGEMS_OWNER_ID: ${{ vars.RUBYGEMS_OWNER_ID }}
        run: |
          set -euo pipefail
          : "${RUBYGEMS_OWNER_ID:?Set RUBYGEMS_OWNER_ID, a variable of the rubygems environment (see CONTRIBUTING.md)}"
          jwt=$(curl --silent --show-error --fail --retry 3 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq --exit-status --raw-output .value)
          echo "::add-mask::${jwt}"
          answer="${RUNNER_TEMP}/rubygems-exchange.json"
          status=$(JWT="$jwt" jq --null-input '{jwt: env.JWT, owner: env.RUBYGEMS_OWNER_ID}' |
            curl --silent --show-error --output "$answer" --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --header 'Accept: application/json' \
              --data-binary @- https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)
          if [ "$status" != 201 ]; then
            echo "::error::rubygems.org refused the token exchange (HTTP ${status}): $(cat "$answer")"
            rm -f "$answer"
            exit 1
          fi
          key=$(jq --exit-status --raw-output .rubygems_api_key "$answer")
          rm -f "$answer"
          echo "::add-mask::${key}"
          GEM_HOST_API_KEY="$key" gem push "dist/flashpi-${TAG#v}.gem"
